apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-backend
  template:
    metadata:
      labels:
        app: notes-backend
    spec:
      containers:
        - name: notes-backend
          image: notes-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: NOTES_SERVER_PORT
              value: "8080"
            - name: NOTES_DB_HOST
              value: "localhost"
            - name: NOTES_DB_PORT
              value: "5432"
            - name: NOTES_DB_NAME
              value: "notes"
            - name: NOTES_DB_USERNAME
              value: "postgres"
            - name: NOTES_DB_PASSWORD
              value: "Admin@123"

---
apiVersion: v1
kind: Service
metadata:
  name: notes-backend
spec:
  selector:
    app: notes-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-frontend
  template:
    metadata:
      labels:
        app: notes-frontend
    spec:
      containers:
        - name: notes-frontend
          image: notes-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              value: "http://notes-backend:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: notes-frontend
spec:
  selector:
    app: notes-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80
  type: LoadBalancer
