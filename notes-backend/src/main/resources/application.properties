spring.application.name=notes-backend
spring.main.banner-mode=OFF

# =======================================
# Server configuration
# =======================================
server.port=${NOTES_SERVER_PORT:8080}
server.servlet.context-path=/api/notes


# =======================================
# Database Configuration
# =======================================
spring.datasource.url=jdbc:postgresql://${NOTES_DB_HOST:localhost}:${NOTES_DB_PORT:5432}/${NOTES_DB_NAME:team-flow}
spring.datasource.username=${NOTES_DB_USERNAME:postgres}
spring.datasource.password=${NOTES_DB_PASSWORD:Admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver


# =======================================
# Database connection pool
# =======================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1000
spring.datasource.hikari.auto-commit=true


# =============================
# JPA / Hibernate
# =============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# =======================================
# Liquibase Configuration
# =======================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

